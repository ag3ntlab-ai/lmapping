name: e2e

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the in-flight run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # Throwaway Postgres for the @db persistence specs. Ephemeral, localhost,
    # non-secret creds; never the production Neon database, so a stray deleteMany
    # can never touch real leads and no prod secret enters CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lmapping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # No pooler in CI, so pooled and unpooled point at the same throwaway DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lmapping_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/lmapping_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Create the schema on the throwaway DB (still db push until the migration
      # baseline lands; CI switches to `prisma migrate deploy` at that point).
      - run: npx prisma db push --skip-generate
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (with database)
        run: npm run test:e2e
        env:
          E2E_WITH_DB: "1"
